[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rastermoves"
version = "0.2.1"
description = "Modular AI image upscaling for DanceFlow, with OpenModelDB model plugins and automatic weight downloads"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [{name = "Kieran Simkin"}]
dependencies = [
  "numpy>=1.24,<3", "Pillow>=10.4", "requests>=2.32.3",
  "filelock>=3.15", "platformdirs>=4.2", "huggingface-hub>=0.27,<3",
]

[project.optional-dependencies]
torch = ["torch>=2.6", "torchvision>=0.21", "spandrel>=0.4.2,<0.5", "safetensors>=0.4.5"]
onnx = ["onnxruntime>=1.20"]
onnx-gpu = ["onnxruntime-gpu>=1.20"]
trace = ["psutil>=5.9.8,<8"]
gdrive = ["gdown>=5.2,<7"]
extra-arches = ["spandrel-extra-arches>=0.2"]
all = ["psutil>=5.9.8,<8", "torch>=2.6", "torchvision>=0.21", "spandrel>=0.4.2,<0.5", "safetensors>=0.4.5", "onnxruntime>=1.20", "gdown>=5.2,<7"]
dev = ["psutil>=5.9.8,<8", "pytest>=8", "build>=1.2", "ruff>=0.9", "twine>=6", "PyYAML>=6", "tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://kieransimkin.co.uk/"
Repository = "https://github.com/kieransimkin/RasterMoves"
Issues = "https://github.com/kieransimkin/RasterMoves/issues"
Changelog = "https://github.com/kieransimkin/RasterMoves/blob/main/CHANGELOG.md"

[project.scripts]
rastermoves = "rastermoves.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rastermoves = ["models/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: downloads real model weights; enabled only by RASTERMOVES_LIVE=1"]

[tool.ruff]
line-length = 110
target-version = "py310"
