name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_models:
        description: Download and run real pretrained model smoke tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m build
  torch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[torch,dev]'
      - run: python -m pytest -q
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live_models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[torch,onnx,dev]'
      - run: python -m pytest -q tests/test_live.py
        env:
          RASTERMOVES_LIVE: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
