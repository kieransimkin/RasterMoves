name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      live_models:
        description: Download and run real pretrained model smoke tests
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Exact commit to test (release workflow supplies the tagged SHA)
        type: string
        default: ''
      live_models:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
  runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[torch,onnx,gdrive,dev]'
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Build and validate distributable artifacts
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - run: python -m build
      - run: python scripts/release_tools.py dist --normalize
      - run: python -m twine check --strict dist/*
      - name: Smoke-test isolated wheel and source installations
        shell: bash
        run: |
          VERSION=$(python -c 'import rastermoves; print(rastermoves.__version__)')
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install dist/*.whl
          cp scripts/smoke_installed.py "$RUNNER_TEMP/smoke_installed.py"
          (cd "$RUNNER_TEMP" && ./wheel-test/bin/python smoke_installed.py --version "$VERSION")
          python -m venv "$RUNNER_TEMP/sdist-test"
          "$RUNNER_TEMP/sdist-test/bin/python" -m pip install dist/*.tar.gz
          (cd "$RUNNER_TEMP" && ./sdist-test/bin/python smoke_installed.py --version "$VERSION")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
  live:
    if: inputs.live_models == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[torch,onnx,dev]'
      - run: python -m pytest -q tests/test_live.py
        env:
          RASTERMOVES_LIVE: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
